<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dimora Pietra Viva · B&B nei Sassi di Matera</title>

<style>
:root{--stone:#efe7da;--stone-2:#e2d6c3;--ink:#2b241d;--muted:#6f6355;--accent:#a0522d;--accent-2:#7d3f22;--white:#fffdf9}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.6}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.15}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.demo{background:var(--ink);color:#f5ecdf;text-align:center;font-size:13px;padding:7px 16px}
nav{position:sticky;top:0;z-index:10;background:rgba(255,253,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--stone-2)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;text-decoration:none}
.links{display:flex;gap:24px;align-items:center;font-size:14px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
.links a.btn,.links a.btn:hover{color:#fff}
.lang{border:1px solid var(--stone-2);background:none;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:13px 26px;border-radius:40px;font-weight:600;font-size:15px;border:0;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border:1.5px solid #fff}
.hero{position:relative;min-height:86vh;display:flex;align-items:flex-end;color:#fff;background:url(img/hero.jpg) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(30,20,10,.72))}
.hero .wrap{position:relative;padding-bottom:70px;width:100%}
.hero h1{font-size:clamp(40px,7vw,76px);max-width:760px}
.hero p{font-size:18px;max-width:560px;margin:14px 0 28px;opacity:.92}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:5px 14px;border-radius:20px;font-size:13px;margin-bottom:18px}
section{padding:90px 0}
.eyebrow{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(32px,4.5vw,46px);margin-bottom:18px}
.lead{color:var(--muted);font-size:17px;max-width:620px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.split img{border-radius:6px;aspect-ratio:4/3;object-fit:cover}
.perks{background:var(--stone)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px}
.card{background:var(--white);border-radius:6px;padding:28px;border:1px solid var(--stone-2)}
.card h3{font-size:24px;margin-bottom:6px}
.card p{color:var(--muted);font-size:15px}
.room{padding:0;overflow:hidden}
.room .ph{aspect-ratio:4/3;background:linear-gradient(135deg,#d9c8ae,#b89b74);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;letter-spacing:.05em}
.room .body{padding:22px 24px 26px}
.price{margin-top:12px;font-weight:600;color:var(--ink)}
.price small{color:var(--muted);font-weight:400}
.save{background:var(--ink);color:#f5ecdf}
.save .lead{color:#cfc2b0}
.save .grid3 .card{background:transparent;border-color:#4a3f33}
.save .card p{color:#cfc2b0}
.big{font-family:"Cormorant Garamond",serif;font-size:44px;color:#e9b48f}
.reviews .card{font-size:15px}
.stars{color:#c98a2e;letter-spacing:2px;margin-bottom:8px}
.who{margin-top:12px;color:var(--muted);font-size:13px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--stone-2);border-radius:6px;font:inherit;background:var(--white);color:var(--ink)}
.full{grid-column:1/-1}
#vista{background:var(--stone)}
.stage{position:relative;height:520px;border-radius:6px;overflow:hidden;margin-top:34px;background:#2b241d}
#map3d,#pano{position:absolute;inset:0}
#pano{opacity:0;pointer-events:none;transition:opacity .6s}
.stage.in #pano{opacity:1;pointer-events:auto}
.stage.in #map3d{display:none}
.pin{width:46px;height:46px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;animation:bob 1.6s ease-in-out infinite}
.pin span{transform:rotate(45deg);color:#fff;font:600 18px "Cormorant Garamond",serif}
@keyframes bob{50%{margin-top:-8px}}
.tag{position:absolute;left:16px;top:16px;z-index:3;background:rgba(255,253,249,.95);border-radius:6px;padding:12px 16px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:14px}
.tag b{font-family:"Cormorant Garamond",serif;font-size:21px;display:block}
.tag .btn{margin-top:10px;padding:9px 16px;font-size:13px}
.stage .back{position:absolute;right:16px;top:16px;z-index:3;display:none;padding:9px 16px;font-size:13px}
.stage.in .back{display:inline-block}
.stage.in .tag{display:none}
.replay{position:absolute;right:16px;bottom:30px;z-index:3;background:rgba(255,253,249,.95);border:0;border-radius:20px;padding:7px 14px;font-size:12px;cursor:pointer;color:var(--ink)}
.stage.in .replay{display:none}
.hint{margin-top:12px;font-size:13px;color:var(--muted)}
.hint a{color:var(--muted)}
.map{border:0;width:100%;height:360px;border-radius:6px;filter:sepia(.25)}
footer{background:var(--stone);padding:40px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.wa{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20}
.wa svg{width:30px;height:30px;fill:#fff}
@media (max-width:820px){
  .links a:not(.btn){display:none}
  .split,.grid3,form{grid-template-columns:1fr}
  section{padding:64px 0}
  .stage{height:440px}
  .tag{right:16px;max-width:none}
  .hero{min-height:78vh}
}
</style>
</head>

<a class="wa" href="https://wa.me/390000000000" aria-label="WhatsApp" id="wa"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1 1 2 1.3 2.3 1.4.3.2.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.7-.1 1.2z"/></svg></a>

<script>
const WHATSAPP = "390000000000"; // numero della struttura
let lang = "it";
function apply(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-it]").forEach(el => el.innerHTML = el.dataset[lang]);
  document.getElementById("lang").textContent = lang === "it" ? "EN" : "IT";
}
document.getElementById("lang").onclick = () => { lang = lang === "it" ? "en" : "it"; apply(); };
document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const msg = lang === "it"
    ? `Ciao! Sono ${d.nome}. Vorrei sapere la disponibilità dal ${d.arrivo} al ${d.partenza} per ${d.ospiti} ospiti.${d.note ? " " + d.note : ""}`
    : `Hi! I'm ${d.nome}. Is there availability from ${d.arrivo} to ${d.partenza} for ${d.ospiti} guests?${d.note ? " " + d.note : ""}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, "_blank");
};
apply();
// --- Vista 3D + 360° ---
const STRUTTURA = [16.60632, 40.66665]; // lng, lat della struttura
const ARRIVO = {zoom:16.4, pitch:57, bearing:95, padding:{top:160}}; // inquadratura finale: guarda verso i Sassi
const stage = document.getElementById("stage");
let viewer = null, flown = false, map = null;
function fly(){
  if (!map) return;
  map.jumpTo({center:[16.598,40.664], zoom:12.3, pitch:0, bearing:0});
  map.flyTo({center:STRUTTURA, ...ARRIVO, duration:7000, essential:true, curve:1.6});
}
if (window.maplibregl) {
  map = new maplibregl.Map({
    container:"map3d", center:[16.598,40.664], zoom:12.3, pitch:0, maxPitch:75,
    attributionControl:{compact:true}, cooperativeGestures:true,
    style:{version:8,
      sources:{
        sat:{type:"raster",tileSize:256,maxzoom:19,attribution:"Imagery © Esri, Maxar, Earthstar Geographics",
          tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]},
        dem:{type:"raster-dem",encoding:"terrarium",tileSize:256,maxzoom:15,attribution:"Terrain: Mapzen/AWS",
          tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"]}
      },
      layers:[{id:"sat",type:"raster",source:"sat"}],
      terrain:{source:"dem",exaggeration:1.6},
      sky:{"sky-color":"#8fbbe3","horizon-color":"#f3ece2","fog-color":"#f3ece2","sky-horizon-blend":.7,"horizon-fog-blend":.6,"fog-ground-blend":.92}
    }
  });
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-left");
  const el = document.createElement("div"); el.className = "pin"; el.innerHTML = "<span>PV</span>";
  el.onclick = () => enter();
  new maplibregl.Marker({element:el, anchor:"bottom"}).setLngLat(STRUTTURA).addTo(map);
  map.on("load", () => {
    new IntersectionObserver((es, o) => { if (es[0].isIntersecting && !flown) { flown = true; fly(); o.disconnect(); } }, {threshold:.5}).observe(stage);
  });
}
function enter(){
  stage.classList.add("in");
  if (!viewer && window.pannellum) viewer = pannellum.viewer("pano", {
    type:"equirectangular", panorama:"img/vista360.jpg",
    haov:360, vaov:89, vOffset:0, minPitch:-44, maxPitch:44,
    autoLoad:true, autoRotate:-3, compass:false, hfov:90, minHfov:50, maxHfov:100
  });
}
document.getElementById("enter").onclick = enter;
document.getElementById("back").onclick = () => { stage.classList.remove("in"); map && map.resize(); };
document.getElementById("replay").onclick = fly;
</script>
